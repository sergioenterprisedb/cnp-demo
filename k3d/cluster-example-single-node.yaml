apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-example
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  nodeMaintenanceWindow:
    inProgress: true
    reusePVC: false
  enableSuperuserAccess: true

  storage:
    size: 1Gi

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: datacenter
                operator: In
                values:
                  - dc1
